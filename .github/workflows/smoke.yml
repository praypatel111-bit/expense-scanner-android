name: Smoke test on an emulator

# Run by hand (Actions tab > Smoke test on an emulator > Run workflow). Builds the app with an
# extra x86_64 library set so it runs on the emulator, then clicks through it (ci/smoke.sh).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK (plus x86_64 for the emulator)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PwithX86

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Click through the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disable-animations: true
          script: bash ci/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screens
          path: shots/
